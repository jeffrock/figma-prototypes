<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figma Prototypes</title>
<style>
  :root { --bg:#f5f6f8; --fg:#16181d; --muted:#6b7280; --line:rgba(22,24,29,.1); --link:#1d4ed8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141a; --fg:#eef0f4; --muted:#9aa1ad; --line:rgba(238,240,244,.12); --link:#7fa4ff; }
  }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:40px 16px; }
  main { max-width:640px; margin:0 auto; }
  h1 { font-size:20px; font-weight:600; margin:0 0 4px; }
  p { color:var(--muted); font-size:14px; margin:0 0 24px; }
  ul { list-style:none; padding:0; margin:0; border-top:1px solid var(--line); }
  li { border-bottom:1px solid var(--line); }
  a { display:flex; justify-content:space-between; gap:12px; padding:14px 0; color:var(--fg); text-decoration:none; }
  a:hover span:first-child, a:focus-visible span:first-child { color:var(--link); text-decoration:underline; }
  a span:last-child { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap; }
</style>
</head>
<body>
<main>
  <h1>Figma Prototypes</h1>
  <p>Hosted prototype embeds. Each lives in its own folder.</p>
  <ul>
    <li><a href="getwyz-ios/"><span>GetWyz iOS Prototype</span><span>2026-09-14</span></a></li>
  </ul>
</main>
</body>
</html>
